name: iOS CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app
        run: xcodebuild -project WeighIt.xcodeproj -scheme WeighIt -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
